<!DOCTYPE html>
<html lang="en">

<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/vossa-key.js" crossorigin="anonymous"></script>
  <title>TinDog</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">TinDog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Pricing</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
      </ul>
    </div>  
  </nav>
  <!-- Title -->
  <section id="title" class="gradient-background">
  <div class="container-fluid py-5 px-5"> 
    <div class="row align-items-center" justify-content-center>
      <div class="col-lg-6">
          </div>
      <div class="col-lg-6"></div>
      
      <div class="col-lg-6 text-start">
        <h1 class="display-3 fw-bold">Meet new and interesting dogs nearby.</h1>
        <button type="button" class="btn btn-dark btn-lg download-button">
          <i class="fa-brands fa-apple"></i> Download
        </button>
        <button type="button" class="btn btn-outline-light btn-lg download-button">
          <i class="fa-brands fa-google-play"></i> Download
        </button>
        <p class="lead mt-3">Connect with other dog lovers in your area!</p>
      </div>

      <div class="col-lg-6">
        <img src="./images/iphone.png" class="img-fluid title-image" alt="iphone-mockup">
      </div>

    </div>
  </div>
</section>
  <!-- Features -->
  <section id="features">

  </section>
  <!-- Testimonial -->
  <section id="testimonial">

  </section>
  <!-- Pricing -->

  </section>
  <!-- Footer -->
  <section id="footer">

  </section>
